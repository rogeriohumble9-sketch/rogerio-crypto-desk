services:
  - type: web
    name: rogerio-crypto-desk
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: SQLITE_PATH
        value: /tmp/desk.sqlite
      - key: DESK_ACCESS_TOKEN
        sync: false
